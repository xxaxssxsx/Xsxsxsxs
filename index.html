<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Investigação</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050814;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 450px;
      margin: 60px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      color: white;
    }

    .logo span {
      color: #ff2447;
    }

    .card {
      background: #0b1024;
      border: 1px solid #214cff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0, 70, 255, .2);
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #283b78;
      background: #050814;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .entrar {
      background: linear-gradient(90deg, #174eff, #2875ff);
    }

    .criar {
      background: linear-gradient(90deg, #ff163f, #ff315a);
    }

    #mensagem {
      text-align: center;
      margin-top: 15px;
      color: #ff6078;
    }

    #painel {
      display: none;
    }

    .ferramentas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .ferramenta {
      padding: 25px 10px;
      border-radius: 15px;
      background: #0b1024;
      border: 1px solid #214cff;
      text-align: center;
    }

    .sair {
      background: #e51b3e;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="container" id="login">

    <div class="logo">
      <h1>PAINEL <span>INVESTIGAÇÃO</span></h1>
    </div>

    <div class="card">

      <h2>Entrar</h2>

      <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
      >

      <input
        type="password"
        id="senha"
        placeholder="Sua senha"
      >

      <button class="entrar" onclick="entrar()">
        Entrar
      </button>

      <button class="criar" onclick="criarConta()">
        Criar conta
      </button>

      <div id="mensagem"></div>

    </div>
  </div>


  <!-- PAINEL -->
  <div class="container" id="painel">

    <div class="logo">
      <h1>PAINEL <span>INVESTIGAÇÃO</span></h1>
      <p>Olá, <span id="usuario"></span></p>
    </div>

    <div class="ferramentas">

      <div class="ferramenta">
        🌐
        <h3>Buscar IP</h3>
      </div>

      <div class="ferramenta">
        📞
        <h3>Dados de Telefone</h3>
      </div>

      <div class="ferramenta">
        🚗
        <h3>Veículo</h3>
      </div>

      <div class="ferramenta">
        🏢
        <h3>CNPJ</h3>
      </div>

      <div class="ferramenta">
        🪪
        <h3>CPF</h3>
      </div>

      <div class="ferramenta">
        👤
        <h3>Buscar Nome</h3>
      </div>

      <div class="ferramenta">
        🔗
        <h3>Redes Sociais</h3>
      </div>

      <div class="ferramenta">
        ✉️
        <h3>Consultar E-mail</h3>
      </div>

      <div class="ferramenta">
        📍
        <h3>CEP</h3>
      </div>

      <div class="ferramenta">
        🪪
        <h3>CPF Completo</h3>
      </div>

    </div>

    <button class="sair" onclick="sair()">
      Sair
    </button>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCpLGPXTJbpJr5waC7CCLNiX6a5m7KV7Y8",
      authDomain: "puxar-dados-edf9d.firebaseapp.com",
      projectId: "puxar-dados-edf9d",
      storageBucket: "puxar-dados-edf9d.firebasestorage.app",
      messagingSenderId: "1027365433148",
      appId: "1:1027365433148:web:5a6b4b05844117828f3839"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    window.criarConta = async function() {

      const email =
        document.getElementById("email").value.trim();

      const senha =
        document.getElementById("senha").value;

      const mensagem =
        document.getElementById("mensagem");


      if (!email || !senha) {
        mensagem.textContent =
          "Digite o e-mail e a senha.";
        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          senha
        );

        mensagem.style.color = "#00ff88";
        mensagem.textContent =
          "Conta criada com sucesso!";

      } catch (error) {

        console.error(error);

        mensagem.style.color = "#ff405c";
        mensagem.textContent =
          traduzirErro(error.code);

      }
    };


    window.entrar = async function() {

      const email =
        document.getElementById("email").value.trim();

      const senha =
        document.getElementById("senha").value;

      const mensagem =
        document.getElementById("mensagem");


      if (!email || !senha) {
        mensagem.textContent =
          "Digite o e-mail e a senha.";
        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          senha
        );

      } catch (error) {

        console.error(error);

        mensagem.style.color = "#ff405c";
        mensagem.textContent =
          traduzirErro(error.code);

      }
    };


    window.sair = async function() {

      await signOut(auth);

    };


    onAuthStateChanged(auth, (user) => {

      const login =
        document.getElementById("login");

      const painel =
        document.getElementById("painel");

      const usuario =
        document.getElementById("usuario");


      if (user) {

        login.style.display = "none";
        painel.style.display = "block";

        usuario.textContent =
          user.email;

      } else {

        login.style.display = "block";
        painel.style.display = "none";

      }

    });


    function traduzirErro(codigo) {

      switch (codigo) {

        case "auth/email-already-in-use":
          return "Este e-mail já possui uma conta.";

        case "auth/invalid-email":
          return "E-mail inválido.";

        case "auth/weak-password":
          return "A senha precisa ter pelo menos 6 caracteres.";

        case "auth/invalid-credential":
          return "E-mail ou senha incorretos.";

        case "auth/user-not-found":
          return "Usuário não encontrado.";

        case "auth/wrong-password":
          return "Senha incorreta.";

        default:
          return "Não foi possível realizar a operação.";

      }

    }

  </script>

</body>
</html>
